; Custos Horti – Sensor-Node Firmware
; Eine Firmware fuer alle Geraete. Welche Module aktiv sind (z. B. DHT22 an GPIO4)
; kommt per Config vom Dashboard (beim Einrichten ueber USB oder spaeter vom Server).
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    bblanchon/ArduinoJson@^7.0.0
build_flags =
    -DFW_VERSION=\"0.6.0\"
