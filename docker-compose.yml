# Custos Horti – Dashboard + Datenbank
# Lokal:   docker compose up -d --build   -> http://localhost:3100
# Dokploy: als "Compose"-Service aus dem GitHub-Repo anlegen und unter Environment setzen:
#          POSTGRES_PASSWORD, INGEST_API_KEY, ADMIN_PASSWORD, SESSION_SECRET (+ optional INGEST_URL, GUEST_PASSWORD)
services:
  custos-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: custos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-custos}
      POSTGRES_DB: custos
    volumes:
      - custos-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U custos"]
      interval: 5s
      retries: 10

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    restart: unless-stopped
    depends_on:
      custos-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://custos:${POSTGRES_PASSWORD:-custos}@custos-db:5432/custos
      INGEST_API_KEY: ${INGEST_API_KEY:-bitte-aendern}
      # Adresse, an die die ESPs ihre Messwerte schicken (im Heimnetz ohne HTTPS am stabilsten)
      INGEST_URL: ${INGEST_URL:-}
      # Login: ohne ADMIN_PASSWORD ist das Dashboard offen (nur lokal sinnvoll)
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      # Gastzugang (nur lesen) – ohne GUEST_PASSWORD deaktiviert
      GUEST_USER: ${GUEST_USER:-gast}
      GUEST_PASSWORD: ${GUEST_PASSWORD:-}
    ports:
      - "${DASHBOARD_PORT:-3100}:3000"

volumes:
  custos-pgdata:
